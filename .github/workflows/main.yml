
name: FTP Directory Diagnostic

on:
  workflow_dispatch:

jobs:
  ftp-check:
    runs-on: ubuntu-latest

    steps:
      - name: Install FTP diagnostic tool
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Inspect FTP directories
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" -e "
            set ftp:ssl-allow no;
            set net:max-retries 1;
            set net:timeout 20;
            echo '=== FTP ROOT ===';
            pwd;
            cls -la;
            echo '=== PUBLIC_HTML ===';
            cd public_html;
            pwd;
            cls -la;
            bye
          "
